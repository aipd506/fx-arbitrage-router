[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-arbitrage-router"
version = "0.1.0"
description = "Foreign Exchange (FX) Cross-Currency Arbitrage Scanner and Multi-Leg Routing Engine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "aipd506"}
]
keywords = ["banking", "forex", "fx", "arbitrage", "bellman-ford", "cross-currency", "routing", "finance", "treasury"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.scripts]
fxrouter = "fx_arbitrage_router.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fx_arbitrage_router*"]
